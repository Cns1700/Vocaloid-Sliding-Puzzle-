<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocaloid Puzzle Gallery</title>
    <link rel="stylesheet" href="style_sheet.css">
</head>
<body>

    <header>
        <h1>VOCALOID PUZZLE GALLERY</h1>
        <p>Pick a character, then an illustration. Clears and personal bests stay on this browser.</p>
        <p id="gallery-progress" class="gallery-progress">Cleared 0 / 24</p>
    </header>

    <section id="daily-stage" class="daily-stage" aria-label="Today's featured puzzle">
        <div class="daily-copy">
            <p class="daily-kicker">Today’s stage</p>
            <h2 id="daily-title">Loading…</h2>
            <p id="daily-meta" class="daily-meta"></p>
            <a id="daily-play" class="daily-play" href="#">Play today’s puzzle</a>
        </div>
        <div class="daily-art-wrap">
            <img id="daily-art" class="daily-art" alt="Today’s featured illustration">
        </div>
    </section>

    <main class="gallery-grid">

        <!-- Center: Hatsune Miku (Original) -->
        <div class="grid-wrapper pos-center">
            <div class="character-box miku-original-card">
                <div class="card-title">Hatsune Miku</div>
            </div>
            <div class="thumbnail-row">
                <a data-preview="previews/Hatsune-Miku__Hatsune-Miku-images__Cyber-Miku-Revamped2-1.webp" href="workspace_template.html?char=miku-original&puzzle=Cyber-Miku-Revamped2-1.jpg" class="thumb-link">
                    <img src="thumbs/Hatsune-Miku__Hatsune-Miku-images__Cyber-Miku-Revamped2-1.webp" loading="lazy" decoding="async" alt="Cyber Miku Bike" class="thumb-img">
                </a>
                <a data-preview="previews/Hatsune-Miku__Hatsune-Miku-images__Cyber_Miku-Weapon_Engage.webp" href="workspace_template.html?char=miku-original&puzzle=Cyber_Miku-Weapon_Engage.jpg" class="thumb-link">
                    <img src="thumbs/Hatsune-Miku__Hatsune-Miku-images__Cyber_Miku-Weapon_Engage.webp" loading="lazy" decoding="async" alt="Cyber Miku - Weapon Engage" class="thumb-img">
                </a>
                <a data-preview="previews/Hatsune-Miku__Hatsune-Miku-images__Miku_Witch.webp" href="workspace_template.html?char=miku-original&puzzle=Miku_Witch.jpg" class="thumb-link">
                    <img src="thumbs/Hatsune-Miku__Hatsune-Miku-images__Miku_Witch.webp" loading="lazy" decoding="async" alt="Witch Miku" class="thumb-img">
                </a>
                <a data-preview="previews/Hatsune-Miku__Hatsune-Miku-images__Miku-V!.webp" href="workspace_template.html?char=miku-original&puzzle=Miku-V!.jpg" class="thumb-link">
                    <img src="thumbs/Hatsune-Miku__Hatsune-Miku-images__Miku-V!.webp" loading="lazy" decoding="async" alt="Miku Cyber Life" class="thumb-img">
                </a>
                <a data-preview="previews/Hatsune-Miku__Hatsune-Miku-images__Miku-V2.webp" href="workspace_template.html?char=miku-original&puzzle=Miku-V2.jpg" class="thumb-link">
                    <img src="thumbs/Hatsune-Miku__Hatsune-Miku-images__Miku-V2.webp" loading="lazy" decoding="async" alt="Miku Hexagons" class="thumb-img">
